<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Django Calculator</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            color: #1f2937;
            background: #eef2ff;
        }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1rem;
            box-sizing: border-box;
        }
        main {
            width: min(100%, 26rem);
            padding: 2rem;
            box-sizing: border-box;
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 1rem 2.5rem #1e293b1a;
        }
        h1 { margin-top: 0; }
        label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
        input {
            width: 100%;
            padding: .75rem;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: .5rem;
            font: inherit;
        }
        .operations {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: .5rem;
            margin-top: 1.25rem;
        }
        button {
            padding: .75rem;
            border: 0;
            border-radius: .5rem;
            background: #4f46e5;
            color: #fff;
            font: inherit;
            font-size: 1.1rem;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }
        .message {
            margin: 1.25rem 0 0;
            padding: .85rem;
            border-radius: .5rem;
            overflow-wrap: anywhere;
        }
        .error { background: #fee2e2; color: #991b1b; }
        .result { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
<main>
    <h1>Calculator</h1>
    <p>Enter two numbers and choose an operation.</p>
    <form method="post">
        {% csrf_token %}
        <label for="first-number">First number</label>
        <input id="first-number" name="first_number" type="text" inputmode="decimal"
               value="{{ first_number }}" required>

        <label for="second-number">Second number</label>
        <input id="second-number" name="second_number" type="text" inputmode="decimal"
               value="{{ second_number }}" required>

        <div class="operations" aria-label="Calculator operations">
            <button type="submit" name="operation" value="add" aria-label="Add">+</button>
            <button type="submit" name="operation" value="subtract" aria-label="Subtract">−</button>
            <button type="submit" name="operation" value="multiply" aria-label="Multiply">×</button>
            <button type="submit" name="operation" value="divide" aria-label="Divide">÷</button>
        </div>
    </form>

    {% if error %}
        <p class="message error" role="alert">{{ error }}</p>
    {% elif result != None %}
        <p class="message result" role="status">
            Result: {{ result }}
        </p>
    {% endif %}
</main>
</body>
</html>
